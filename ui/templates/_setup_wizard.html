<div class="setup-scrim" id="setupScrim" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
  <div class="setup-card">
    <div class="setup-kicker" id="setupKicker">First run</div>
    <div class="setup-steps" id="setupPips"></div>
    <div class="setup-title" id="setupTitle"></div>
    <div class="setup-copy" id="setupCopy"></div>
    <div id="setupBody"></div>
    <div class="setup-actions">
      <button type="button" class="setup-btn" id="setupSkip">Close</button>
      <button type="button" class="setup-btn setup-btn--accent" id="setupNext">Continue</button>
    </div>
    <div class="setup-note" id="setupNote"></div>
  </div>
</div>
