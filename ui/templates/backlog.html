<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/Qmeka — backlog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/qmeka-chrome.css">
<style>
:root {
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --radius: 12px; --radius-sm: 8px; --radius-pill: 999px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  --transition: .22s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg: #0f0d0a; --bg-surface: #1a1714; --bg-surface-alt: #242019;
  --bg-elevated: #2e2923; --text: #f5f0e8; --text-muted: #a89e8c;
  --text-dim: #7a7062; --accent: #f0a830; --accent-soft: rgba(240,168,48,.12);
  --border: rgba(240,168,48,.15); --border-strong: rgba(240,168,48,.30);
  --green: #6ec87a; --green-soft: rgba(110,200,122,.12);
  --red: #e85d4a; --red-soft: rgba(232,93,74,.12);
  --amber: #f0a830; --amber-soft: rgba(240,168,48,.12);
}
[data-theme="light"] {
  --bg: #f8f5f0; --bg-surface: #ffffff; --bg-surface-alt: #f0ece5;
  --bg-elevated: #e8e3da; --text: #1a1714; --text-muted: #5a5248;
  --text-dim: #8a8070; --accent: #c88520; --accent-soft: rgba(200,133,32,.1);
  --border: rgba(26,23,20,.12); --border-strong: rgba(26,23,20,.25);
  --green: #2a8a3a; --green-soft: rgba(42,138,58,.1);
  --red: #c83020; --red-soft: rgba(200,48,32,.1);
  --amber: #c88520; --amber-soft: rgba(200,133,32,.1);
}
[data-theme="cyber"] {
  --bg: #0a0e14; --bg-surface: #111820; --bg-surface-alt: #162030;
  --bg-elevated: #1a2838; --text: #d4e0ec; --text-muted: #6a8098;
  --text-dim: #3a5068; --accent: #00ff88; --accent-soft: rgba(0,255,136,.08);
  --border: rgba(0,255,136,.12); --border-strong: rgba(0,255,136,.25);
  --green: #00ff88; --green-soft: rgba(0,255,136,.1);
  --red: #ff4466; --red-soft: rgba(255,68,102,.1);
  --amber: #ffaa00; --amber-soft: rgba(255,170,0,.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--font-sans); font-size:14px; min-height:100vh; }

.header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); }
.logo { font-family:var(--font-serif); font-size:18px; font-weight:700; color:var(--accent); text-decoration:none; }
.logo__blink { display:inline-block; width:2px; height:18px; background:var(--accent); margin-left:2px; animation:blink 1s step-end infinite; vertical-align:middle; }
@keyframes blink { 50% { opacity:0; } }
.nav { display:flex; gap:8px; }
.nav__link { font-size:13px; color:var(--text-muted); text-decoration:none; padding:6px 12px; border-radius:var(--radius-sm); transition:var(--transition); }
.nav__link:hover { color:var(--text); background:var(--accent-soft); }
.nav__link.active { color:var(--accent); background:var(--accent-soft); }
.theme-toggle { display:flex; gap:4px; }
.theme-btn { width:28px; height:28px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-surface); cursor:pointer; transition:var(--transition); }
.theme-btn:hover { border-color:var(--accent); }
.theme-btn.active { border-color:var(--accent); background:var(--accent-soft); }

.main { max-width:900px; margin:0 auto; padding:32px 24px; }
.page-title { font-family:var(--font-serif); font-size:22px; font-weight:700; margin-bottom:20px; }

.empty { text-align:center; padding:60px 20px; }
.empty__icon { font-size:40px; margin-bottom:12px; opacity:.3; }
.empty__title { font-family:var(--font-serif); font-size:18px; margin-bottom:6px; }
.empty__sub { font-size:13px; color:var(--text-dim); line-height:1.6; }

.filters { display:flex; gap:6px; margin-bottom:16px; }
.filter-btn { padding:5px 12px; border-radius:var(--radius-pill); border:1px solid var(--border); background:transparent; color:var(--text-dim); font-size:12px; cursor:pointer; transition:var(--transition); font-family:var(--font-sans); }
.filter-btn:hover { border-color:var(--accent); color:var(--accent); }
.filter-btn.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }

.backlog-list { display:flex; flex-direction:column; gap:8px; }
.backlog-card { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; align-items:flex-start; gap:12px; transition:var(--transition); }
.backlog-card:hover { border-color:var(--border-strong); }
.backlog-card__check { width:18px; height:18px; border-radius:4px; border:1px solid var(--border); cursor:pointer; flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; transition:var(--transition); }
.backlog-card__check:hover { border-color:var(--accent); }
.backlog-card__check.done { background:var(--green-soft); border-color:var(--green); }
.backlog-card__check.done::after { content:'✓'; font-size:11px; color:var(--green); }
.backlog-card__text { font-size:13px; color:var(--text-muted); line-height:1.5; }
.backlog-card__meta { font-size:11px; color:var(--text-dim); margin-top:4px; font-family:var(--font-mono); }
</style>
</head>
<body>

<header class="header">
  <a href="/" class="logo">/Qmeka<span class="logo__blink"></span></a>
  <nav class="nav">
    <a href="/" class="nav__link">dashboard</a>
    <a href="/launch" class="nav__link">launch</a>
    <a href="/history" class="nav__link">sessions</a>
    <a href="/debug" class="nav__link">debug</a>
  </nav>
  <div class="theme-toggle">
    <button class="theme-btn" data-theme="dark" data-tip="Dark Warm Honey"></button>
    <button class="theme-btn" data-theme="light" data-tip="Light Paper"></button>
    <button class="theme-btn" data-theme="cyber" data-tip="Cyber Phosphor"></button>
  </div>
</header>

<main class="main">
  <div class="page-title">backlog</div>

  {% if items %}
  <div class="filters">
    <button class="filter-btn active" onclick="filterItems('all', this)">all</button>
    <button class="filter-btn" onclick="filterItems('new', this)">open</button>
    <button class="filter-btn" onclick="filterItems('resolved', this)">resolved</button>
  </div>
  <div class="backlog-list" id="backlogList">
    {% for item in items %}
    <div class="backlog-card" data-status="{{ item.status }}">
      <div class="backlog-card__check {% if item.status == 'resolved' %}done{% endif %}"
           onclick="toggleItem('{{ item.id }}', '{{ item.status }}')"></div>
      <div>
        <div class="backlog-card__text">{{ item.text }}</div>
        <div class="backlog-card__meta">{{ item.source }} · iter {{ item.iter }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty">
    <div class="empty__icon">📋</div>
    <div class="empty__title">backlog is empty</div>
    <div class="empty__sub">questions from AI reviewers will appear here after iterations.</div>
  </div>
  {% endif %}
</main>

<script>
/* Theme */
(function() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  document.querySelectorAll('.theme-btn').forEach(btn => {
    if (btn.dataset.theme === saved) btn.classList.add('active');
    btn.addEventListener('click', () => {
      document.documentElement.setAttribute('data-theme', btn.dataset.theme);
      localStorage.setItem('theme', btn.dataset.theme);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
})();

function filterItems(status, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.backlog-card').forEach(card => {
    card.style.display = (status === 'all' || card.dataset.status === status) ? '' : 'none';
  });
}

function toggleItem(id, currentStatus) {
  const newStatus = currentStatus === 'resolved' ? 'new' : 'resolved';
  fetch(`/api/backlog/${id}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: newStatus})
  }).then(() => location.reload());
}
</script>
</body>
</html>
